version: 2
updates:
  # NuGet packages (api/Directory.Packages.props) and local tools (.config/dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released together, so updated together.
      aspnetcore-and-efcore:
        patterns:
          - Microsoft.AspNetCore.*
          - Microsoft.EntityFrameworkCore.*
          - Microsoft.Extensions.*
          - dotnet-ef
      analyzers:
        patterns:
          - Meziantou.Analyzer
          - Microsoft.CodeAnalysis.*
      testing:
        patterns:
          - xunit*

  # npm packages for the front-end.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Majors held back until the tools that depend on them catch up. Review these when they do,
    # and delete the entry to let Dependabot offer the upgrade again.
    ignore:
      # eslint-plugin-jsx-a11y's peer range stops at ESLint 9.
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript-eslint supports TypeScript below 6.1.
      - dependency-name: typescript
        versions: [">=7"]
      # The typings must match the Node version the app runs on (web/.nvmrc, Node 24).
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      mantine:
        patterns:
          - "@mantine/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      lint-and-format:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-*"
          - typescript-eslint
          - globals
          - prettier
      vite-and-vitest:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
          - "vite-plugin-*"
      testing:
        patterns:
          - "@testing-library/*"
          - jsdom
          - msw

  # Base images in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The build's Node must match web/.nvmrc (Node 24).
      - dependency-name: node
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
