version: 2
updates:
  # NuGet packages (api/Directory.Packages.props) and local tools (.config/dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Released together, so updated together.
      aspnetcore-and-efcore:
        patterns:
          - Microsoft.AspNetCore.*
          - Microsoft.EntityFrameworkCore.*
          - Microsoft.Extensions.*
          - dotnet-ef
      analyzers:
        patterns:
          - Meziantou.Analyzer
          - Microsoft.CodeAnalysis.*
      testing:
        patterns:
          - xunit*

  # npm packages for the front-end.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      mantine:
        patterns:
          - "@mantine/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      lint-and-format:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-*"
          - typescript-eslint
          - globals
          - prettier
      vite-and-vitest:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
          - "vite-plugin-*"
      testing:
        patterns:
          - "@testing-library/*"
          - jsdom
          - msw

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
