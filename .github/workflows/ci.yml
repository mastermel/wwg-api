name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI never commits; it only reads the repo.
permissions:
  contents: read

# One run at a time per PR or branch. On PRs a new push cancels the run in progress. On main,
# runs queue instead: every commit gets a result, and an image push is never cut off. GitHub keeps
# at most one waiting run, and a newer push replaces it, so the latest commit is built last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', 'api/**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      # Release, so any analyzer warning fails the build just as it does locally.
      # Also regenerates api/openapi.json from the code.
      - name: Build
        run: dotnet build api/Wwg.slnx --configuration Release

      - name: Check the contract is up to date
        run: |
          if [ -n "$(git status --porcelain -- api/openapi.json)" ]; then
            echo "::error file=api/openapi.json::api/openapi.json doesn't match the code. Build the API locally and commit the updated file."
            git diff -- api/openapi.json
            exit 1
          fi

      # A warning, not a failure: API and front-end deploy together, so a coordinated breaking
      # change in one PR is fine. It flags changes that could affect an already-open browser tab.
      - name: Warn about breaking API changes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git show "origin/$BASE_REF:api/openapi.json" > "$RUNNER_TEMP/base-openapi.json" 2>/dev/null; then
            echo "No api/openapi.json on $BASE_REF yet; nothing to compare."
            exit 0
          fi
          docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD:/repo:ro" tufin/oasdiff:v1.32.1 \
            breaking /base/base-openapi.json /repo/api/openapi.json --format githubactions \
            | sed -E 's/^::error /::warning /; s/file=[^,:]*/file=api\/openapi.json/'

      - name: Test
        run: dotnet test --solution api/Wwg.slnx --configuration Release --no-build

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Publishes the image on main only, after both checks pass: latest and vYYYYMMdd.HHmmss (UTC,
  # computed once per run), for linux/amd64 and linux/arm64.
  docker:
    name: docker
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        run: echo "tag=$(date -u +v%Y%m%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # OCI labels (revision = git SHA, created, source, version), so any running image traces
      # back to its commit.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=WWG Campaigner
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          annotations: |
            org.opencontainers.image.title=WWG Campaigner
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: APP_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
