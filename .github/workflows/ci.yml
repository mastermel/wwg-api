name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# CI never commits; it only reads the repo.
permissions:
  contents: read

# One run at a time per PR or branch. On PRs a new push cancels the run in progress. On main,
# runs queue instead: every commit gets a result, and an image push is never cut off. GitHub keeps
# at most one waiting run, and a newer push replaces it, so the latest commit is built last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('api/Directory.Packages.props', 'api/**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      # Release, so any analyzer warning fails the build just as it does locally.
      - name: Build
        run: dotnet build api/Wwg.slnx --configuration Release

      - name: Test
        run: dotnet test --solution api/Wwg.slnx --configuration Release --no-build
